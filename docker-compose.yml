services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: krishilink
      POSTGRES_PASSWORD: krishilink
      POSTGRES_DB: krishilink
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishilink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://krishilink:krishilink@postgres:5432/krishilink
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-change-in-production-32chars!!
      ENV: development
      DEBUG: "true"
      OTP_DEVELOPMENT_CODE_EXPOSURE_ENABLED: "true"
      AGMARKNET_API_KEY: ${AGMARKNET_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8000,http://localhost:8001
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://krishilink:krishilink@postgres:5432/krishilink
      REDIS_URL: redis://redis:6379/0
      AGMARKNET_API_KEY: ${AGMARKNET_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping | grep -q pong || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  scheduler:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://krishilink:krishilink@postgres:5432/krishilink
      REDIS_URL: redis://redis:6379/0
      AGMARKNET_API_KEY: ${AGMARKNET_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    # The backend image healthcheck targets HTTP; Celery Beat has no HTTP port.
    # Disable the inherited check so a healthy scheduler is not reported as
    # unhealthy solely because it is a non-HTTP process.
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
        PUBLIC_PRERENDER_API_BASE_URL: ${PUBLIC_PRERENDER_API_BASE_URL:-}
        VITE_PUBLIC_SUPPORT_PHONE: ${VITE_PUBLIC_SUPPORT_PHONE:-}
        VITE_PUBLIC_SUPPORT_EMAIL: ${VITE_PUBLIC_SUPPORT_EMAIL:-}
    ports:
      - "5173:8080"
    depends_on:
      - backend

volumes:
  pgdata:
